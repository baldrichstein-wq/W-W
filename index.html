<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeons Koop-Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Dungeons Koop-Edition</h1>
        <p>Ein kooperatives Browser-RPG</p>
    </header>

    <main id="game-container">
        <!-- Status Panel für Spieler -->
        <section id="stats-panel">
            <div class="player-card" id="player1-card">
                <h3>Spieler 1</h3>
                <div id="p1-status" class="status-text">Wartet auf Heldenerstellung...</div>
            </div>
            <div class="player-card" id="player2-card">
                <h3>Spieler 2</h3>
                <div id="p2-status" class="status-text">Wartet auf Heldenerstellung...</div>
            </div>
        </section>

        <!-- Hauptbereich für Textausgabe -->
        <section id="log-panel">
            <div id="game-log"></div>
        </section>

        <!-- Steuerungsbereich für Eingaben -->
        <section id="control-panel">
            <label id="input-query" for="user-input">Spiel lädt...</label>
            <div id="input-area">
                <input type="text" id="user-input" autocomplete="off" disabled>
                <button id="submit-btn" disabled>Senden</button>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
