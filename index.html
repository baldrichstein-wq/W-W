<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeons Koop-Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-screen">
        <div class="start-content">
            <h1 class="log-legend-title" style="font-size: 3.5em;">Dungeons Koop-Edition</h1>
            <p style="font-size: 1.5em; color: var(--accent-color); margin-bottom: 30px;">Ein kooperatives Browser-RPG</p>
            <div style="display: flex; gap: 20px; justify-content: center;">
                <button id="start-game-btn" class="meta-btn" style="font-size: 1.5em; padding: 15px 40px;">⚔️ Abenteuer beginnen ⚔️</button>
                <button id="start-hof-btn" class="meta-btn" style="font-size: 1.2em; padding: 15px 30px;">🏆 Ruhmeshalle</button>
            </div>
        </div>
    </div>

    <!-- Bereich für Charaktererstellung -->
    <div id="char-creator-screen" class="hidden">
        <div class="start-content">
            <h2 class="hof-title">🛡️ Helden versammeln 🛡️</h2>
            <div id="player-count-setup">
                <label for="player-count-select">Wie viele Helden treten die Reise an?</label>
                <select id="player-count-select" class="meta-btn" style="margin: 15px; font-size: 1.2em;"></select>
            </div>
            <div id="player-forms-container"></div>
            <button id="confirm-chars-btn" class="meta-btn" style="font-size: 1.3em; padding: 10px 40px; margin-top: 20px;">⚔️ Abenteuer beginnen ⚔️</button>
        </div>
    </div>

    <header class="hidden">
        <h1>Dungeons Koop-Edition</h1>
        <p>Ein kooperatives Browser-RPG</p>
        <div id="meta-controls">
            <button id="hof-btn" class="meta-btn">🏆 Ruhmeshalle</button>
            <button id="settings-btn" class="meta-btn" title="Einstellungen">⚙️</button>
            <button id="reset-btn" class="meta-btn">♻️ Boss zurücksetzen</button>
        </div>
    </header>

    <main id="game-container" class="hidden">
        <!-- Status Panel für Spieler -->
        <section id="stats-panel">
        </section>

        <!-- Hauptbereich für Textausgabe -->
        <section id="log-panel">
            <!-- Monster Status Display (Sticky am oberen Rand des Logs) -->
            <div id="monster-ui" class="player-card" style="display: none; position: sticky; top: 0; z-index: 10; margin-bottom: 15px; border-color: var(--header-color); background-color: var(--panel-bg);">
                <h3 id="monster-name-ui" style="color: var(--header-color); border-color: var(--header-color);">Gegner</h3>
                <div id="monster-stats-ui" class="status-text"></div>
            </div>
            <div id="game-log"></div>
        </section>

        <!-- Steuerungsbereich für Eingaben -->
        <section id="control-panel">
            <label id="input-query" for="user-input">Spiel lädt...</label>
            <div id="input-area">
                <input type="text" id="user-input" autocomplete="off" disabled>
                <button id="submit-btn" disabled>Senden</button>
            </div>
        </section>
    </main>

    <!-- Modal für die Ruhmeshalle -->
    <div id="hof-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 class="hof-title">🏆 Ruhmeshalle 🏆</h2>
            <div id="hof-list">
                <!-- Einträge werden dynamisch generiert -->
            </div>
        </div>
    </div>

    <!-- Modal für Einstellungen -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="close-settings">&times;</span>
            <h2 class="hof-title">⚙️ Einstellungen ⚙️</h2>
            <div class="settings-group">
                <label for="bg-brightness">🕯️ Helligkeit des Logs:</label>
                <input type="range" id="bg-brightness" min="0" max="100" value="25">
            </div>
            <div class="settings-group">
                <label for="text-speed">✍️ Text-Geschwindigkeit:</label>
                <input type="range" id="text-speed" min="50" max="1000" step="50" value="300">
                <span id="text-speed-val">300ms</span>
            </div>
            <div class="settings-group">
                <label for="master-volume">🔊 Lautstärke:</label>
                <input type="range" id="master-volume" min="0" max="100" value="50">
            </div>
        </div>
    </div>

    <audio id="critical-hp-sound" src="audio/warning.mp3" preload="auto"></audio>
    <script type="module" src="main.js"></script>
</body>
</html>
